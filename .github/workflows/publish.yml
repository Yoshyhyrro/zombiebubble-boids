name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # GitHub Release asset upload
  id-token: write   # OIDC trusted publisher (PyPI)

jobs:
  # ── 1. BUILD ──────────────────────────────────────────────────────────────
  build:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib: libzombiebubble.so
          - os: windows-latest
            lib: zombiebubble.dll
          - os: macos-latest
            lib: libzombiebubble.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.16.0"

      - name: Build native library
        run: zig build pip-lib --release=fast

      - name: Copy library into Python package
        shell: bash
        run: |
          mkdir -p zombiebubble
          cp zig-out/bin/${{ matrix.lib }} zombiebubble/ 2>/dev/null || \
          cp zig-out/lib/${{ matrix.lib }} zombiebubble/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  # ── 2. GITHUB RELEASE ─────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist/

      - name: Create release and attach wheels
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.whl
